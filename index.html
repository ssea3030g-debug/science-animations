<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과학 실험 애니메이션</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap">
<style>
:root{--bg:#f2eadb;--card:#fffaf0;--line:#d8caaf;--ink:#2b2118;--muted:#7a6a58;--clay:#d97757;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:760px;margin:0 auto;padding:48px 16px}
h1{font-size:32px;font-weight:800;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 28px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-bottom:14px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.card:hover{border-color:var(--clay);transform:translateY(-2px)}
.k{font-size:13px;font-weight:700;color:var(--clay);letter-spacing:1px}
.t{font-size:22px;font-weight:800;margin:4px 0}
.d{color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
<h1>과학 실험 애니메이션</h1>
<p class="lead">재생 버튼을 누르고, 전체화면으로 크게 볼 수 있어요.</p>
<a class="card" href="simple-motor/"><div class="k">실험 1</div><div class="t">뱅글뱅글 간이 전동기</div><div class="d">건전지·에나멜선·자석으로 만드는 전동기 — 만드는 방법과 도는 원리</div></a>
<a class="card" href="high-voltage-coil/"><div class="k">실험 2</div><div class="t">고전압 코일과 전자시계</div><div class="d">고전압 코일 근처에서 전자시계 화면이 이상해지는 이유</div></a>
</main>
</body>
</html>
