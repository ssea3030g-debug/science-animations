<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>고전압 코일 시계 실험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
</head>
<body>
<style>
/* Layout: one beige stage with a single glass transport bar (play, seek, time). Palette = Claude clay orange + sand/kraft tan. */
:root{
  --bg:#f2eadb;
  --surface:#fbf6ea;
  --surface-2:#efe5d0;
  --line:#d8caaf;
  --ink:#2b2118;
  --ink-2:#4a3b2c;
  --muted:#7a6a58;
  --clay:#d97757;
  --clay-hi:#f09b74;
  --sand:#a9772e;
  --gold:#f2c35a;
  --kraft:#c9976b;
  --danger:#ee5b3d;
  --f-disp:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.page{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;min-height:100svh;display:grid;align-content:center}
.player{display:block}
.rig{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.bar{min-width:0}
.stage{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#ece2cd;box-shadow:0 30px 60px -36px rgba(90,60,20,.35)}
.stage svg{display:block;width:100%;height:auto}
svg text{font-family:var(--f-body)}
.f-disp{font-family:var(--f-disp);font-weight:800;letter-spacing:-.01em}
.f-mono{font-family:var(--f-mono)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.btn{white-space:nowrap;font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--kraft)}
.btn.primary{background:var(--clay);border-color:var(--clay);color:#2b1308;font-weight:700;min-width:124px;justify-content:center}
.btn.primary:hover{background:var(--clay-hi);border-color:var(--clay-hi)}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn.icon{padding:8px 12px;flex:none}
.btn.icon svg{width:16px;height:16px}
html.lock,html.lock body{overflow:hidden}
.player.full{position:fixed;inset:0;z-index:50;background:var(--bg);padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.player.full .rig{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px}
.player.full .bar{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:2;background:rgba(251,246,234,.97);transition:opacity .25s}
.player.full.idle .bar{opacity:0;pointer-events:none}
.player.full .stage{flex:1 1 auto;min-height:0;display:flex;border-radius:0;border:0;box-shadow:none;background:transparent}
.player.full .stage svg{width:100%;height:100%}
svg.lite [filter]{filter:none}
.player.full.rot{padding:0}
.player.full.rot .rig{position:absolute;top:0;left:0;width:100vh;height:100vw;box-sizing:border-box;padding:8px 12px;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
.scrub{flex:1 1 120px;min-width:60px;accent-color:var(--clay)}
.clock{white-space:nowrap;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
@media (max-width:600px){
  .bar{padding:8px 10px;gap:8px}
  .clock{min-width:0;font-size:12px}
  .btn.primary{min-width:0;padding:8px 14px}
  .btn.icon .t{display:none}
  #playTxt{display:none}
  .btn.primary{padding:10px 16px}
}
</style>

<div class="page">
  <section class="player" id="player" aria-label="애니메이션 플레이어">
   <div class="rig">
    <div class="stage">
      <svg id="svg" viewBox="0 0 1200 720" role="img" aria-label="배터리, 스위치, 고전압 발생기, 코일, 전자시계로 이루어진 실험 장치 애니메이션">
        <defs>
          <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="1.4" fill="#d9cbb0"/></pattern>
          <radialGradient id="glowA" cx="28%" cy="64%" r="55%"><stop offset="0" stop-color="#d97757" stop-opacity=".13"/><stop offset="1" stop-color="#d97757" stop-opacity="0"/></radialGradient>
          <radialGradient id="glowB" cx="86%" cy="28%" r="45%"><stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
          <linearGradient id="gClay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4a47f"/><stop offset=".45" stop-color="#d97757"/><stop offset="1" stop-color="#a8543a"/></linearGradient>
          <radialGradient id="gGlowO"><stop offset="0" stop-color="#f09b74" stop-opacity=".85"/><stop offset=".55" stop-color="#f09b74" stop-opacity=".35"/><stop offset="1" stop-color="#f09b74" stop-opacity="0"/></radialGradient>
          <radialGradient id="gGlowG"><stop offset="0" stop-color="#f2c35a" stop-opacity=".85"/><stop offset=".55" stop-color="#f2c35a" stop-opacity=".35"/><stop offset="1" stop-color="#f2c35a" stop-opacity="0"/></radialGradient>
          <radialGradient id="gGlowR"><stop offset="0" stop-color="#f2c35a" stop-opacity="0"/><stop offset=".5" stop-color="#f2c35a" stop-opacity="0"/><stop offset=".78" stop-color="#f2c35a" stop-opacity=".75"/><stop offset="1" stop-color="#f2c35a" stop-opacity="0"/></radialGradient>
          <linearGradient id="gClayH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4a47f"/><stop offset=".45" stop-color="#d97757"/><stop offset="1" stop-color="#a8543a"/></linearGradient>
          <linearGradient id="gHV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#37322b"/><stop offset="1" stop-color="#151210"/></linearGradient>
          <linearGradient id="gCase" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a423a"/><stop offset="1" stop-color="#1a1613"/></linearGradient>
          <linearGradient id="gStrap" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b57c52"/><stop offset=".5" stop-color="#e0b185"/><stop offset="1" stop-color="#a86f46"/></linearGradient>
          <linearGradient id="gLcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e8d0"/><stop offset="1" stop-color="#d8cba8"/></linearGradient>
          <linearGradient id="gRange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d97757" stop-opacity=".2"/><stop offset="1" stop-color="#f09b74"/></linearGradient>
          <linearGradient id="gGlare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <pattern id="scn" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".3"/></pattern>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="sh" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#3a2410" flood-opacity=".3"/></filter>
          <marker id="mF" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#b07b2e"/></marker>
          <marker id="mR" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1 L1 5 L9 9 Z" fill="#b07b2e"/></marker>
          <clipPath id="lcdClip"><rect x="-40" y="-36" width="80" height="68" rx="9"/></clipPath>
        </defs>

        <rect width="1200" height="720" fill="#ece2cd"/>
        <rect width="1200" height="720" fill="url(#dots)"/>
        <rect width="1200" height="720" fill="url(#glowA)"/>
        <rect width="1200" height="720" fill="url(#glowB)"/>

        <g id="tray" opacity="0">
          <rect x="40" y="585" width="1120" height="112" rx="26" fill="#f7f0e0" stroke="#d9cbb0" stroke-width="2"/>
          <text x="66" y="613" font-size="16" font-weight="700" fill="#8a7a66" letter-spacing="2">준비물</text>
        </g>

        <g id="bench">
          <g id="geom" opacity="0" aria-hidden="true"></g>
          <g id="wires"></g>
          <g id="field"></g>
          <g id="emi"></g>

          <!-- 18650 battery (upright) -->
          <g id="p-bat" filter="url(#sh)">
            <rect x="-42" y="-140" width="84" height="280" rx="26" fill="#2a2420" stroke="#4b4036" stroke-width="1.5"/>
            <rect x="-34" y="-132" width="68" height="264" rx="19" fill="#15110e"/>
            <ellipse id="bat-glow" cx="0" cy="0" rx="78" ry="190" fill="url(#gGlowO)" opacity="0"/>
            <rect x="-30" y="-120" width="60" height="240" rx="16" fill="url(#gClayH)"/>
            <rect x="-9" y="120" width="18" height="12" rx="5" fill="#ecd9b6"/>
            <rect x="-24" y="-114" width="7" height="228" rx="3.5" fill="#fff" opacity=".2"/>
            <text transform="translate(-7 0) rotate(-90)" y="9" class="f-mono" font-size="28" font-weight="700" fill="#2c1409" text-anchor="middle">18650</text>
            <text transform="translate(16 0) rotate(-90)" y="4" font-size="12" font-weight="500" fill="#4a2410" text-anchor="middle">3.7V · 3500mAh</text>
            <text x="0" y="104" font-size="26" font-weight="700" fill="#2c1409" text-anchor="middle">+</text>
            <text x="0" y="-98" font-size="26" font-weight="700" fill="#2c1409" text-anchor="middle">−</text>
            <path d="M0 140 V146" stroke="#f09b74" stroke-width="8" stroke-linecap="round"/>
            <path d="M0 -140 V-162" stroke="#9a8b78" stroke-width="8" stroke-linecap="round"/>
          </g>

          <!-- toggle switch -->
          <g id="p-sw" filter="url(#sh)">
            <rect x="-62" y="1" width="16" height="12" rx="4" fill="#d9b574"/>
            <rect x="46" y="1" width="16" height="12" rx="4" fill="#d9b574"/>
            <rect x="-52" y="-28" width="104" height="56" rx="18" fill="#2d2721" stroke="#4b4036" stroke-width="1.5"/>
            <rect x="-44" y="-20" width="88" height="40" rx="12" fill="#1a1612"/>
            <g id="sw-lever" transform="rotate(-30 0 -28)">
              <rect x="-6" y="-80" width="12" height="54" rx="6" fill="#d97757"/>
              <circle cx="0" cy="-82" r="9" fill="#f3dfb8"/>
            </g>
            <circle cx="0" cy="-28" r="13" fill="#cdbfa6" stroke="#8b7d68" stroke-width="2"/>
            <circle id="sw-dot" cx="34" cy="-8" r="5" fill="#3d352c"/>
            <text id="sw-txt" x="-8" y="15" class="f-mono" font-size="15" font-weight="700" fill="#a89c8a" text-anchor="middle">OFF</text>
          </g>

          <!-- high voltage generator -->
          <g id="p-hv" filter="url(#sh)">
            <ellipse id="hv-glow" cx="0" cy="0" rx="190" ry="120" fill="url(#gGlowG)" opacity="0"/>
            <path d="M-120 -30 H-134" stroke="#9a8b78" stroke-width="7" stroke-linecap="round"/>
            <path d="M-120 30 H-134" stroke="#f09b74" stroke-width="7" stroke-linecap="round"/>
            <path d="M120 -30 H134" stroke="#f2b650" stroke-width="12" stroke-linecap="round"/>
            <path d="M120 30 H134" stroke="#c9a46b" stroke-width="12" stroke-linecap="round"/>
            <rect x="-120" y="-65" width="240" height="130" rx="20" fill="url(#gHV)" stroke="#f2c35a" stroke-opacity=".35" stroke-width="1.5"/>
            <rect x="-110" y="-55" width="220" height="110" rx="13" fill="none" stroke="#fff" stroke-opacity=".06"/>
            <path d="M-80 -34 L-50 18 L-110 18 Z" fill="#f2c35a" stroke="#f2c35a" stroke-width="5" stroke-linejoin="round" transform="translate(6 -4) scale(.88)"/>
            <path d="M-76 -22 L-86 -2 L-77 -2 L-82 10 L-68 -8 L-77 -8 Z" fill="#1a1612" transform="translate(6 -4) scale(.88)"/>
            <text x="30" y="-14" font-size="18" font-weight="800" fill="#f2c35a" text-anchor="middle" letter-spacing="1">HIGH VOLTAGE</text>
            <text x="30" y="19" class="f-mono" font-size="28" font-weight="700" fill="#f6efe3" text-anchor="middle">1000kV</text>
            <text x="30" y="43" class="f-mono" font-size="14" fill="#a89c8a" text-anchor="middle">IN 3–6V DC</text>
          </g>

          <!-- enamel wire coil (axis runs left to right) -->
          <g id="p-coil">
            <ellipse id="coil-glow" cx="0" cy="0" rx="96" ry="160" fill="url(#gGlowR)" opacity="0"/>
            <g id="coil-back"></g>
            <g id="coil-front"></g>
            <circle cx="-49" cy="-118" r="6" fill="#e8c68e"/>
            <circle cx="49" cy="118" r="6" fill="#e8c68e"/>
          </g>

          <!-- digital watch -->
          <g id="p-watch" style="--s-on:#2a2118;--s-off:rgba(42,33,24,.075)">
            <g id="w-body">
              <path d="M-30 -50 L-27 -80 Q-26 -90 -16 -90 H16 Q26 -90 27 -80 L30 -50 Z" fill="url(#gStrap)"/>
              <path d="M-30 50 L-27 80 Q-26 90 -16 90 H16 Q26 90 27 80 L30 50 Z" fill="url(#gStrap)"/>
              <path d="M-19 -54 L-17 -84 M19 -54 L17 -84 M-19 54 L-17 84 M19 54 L17 84" stroke="#f6e3c3" stroke-width="1.6" stroke-dasharray="4 4" opacity=".5" fill="none"/>
              <circle cx="0" cy="66" r="2.6" fill="#6a4529"/><circle cx="0" cy="76" r="2.6" fill="#6a4529"/>
              <rect x="54" y="-26" width="8" height="16" rx="3" fill="#6a5d50"/>
              <rect x="54" y="8" width="8" height="16" rx="3" fill="#6a5d50"/>
              <rect x="-62" y="-10" width="8" height="20" rx="3" fill="#6a5d50"/>
              <rect x="-56" y="-56" width="112" height="112" rx="32" fill="url(#gCase)" stroke="#5a4e43" stroke-width="2"/>
              <rect x="-48" y="-48" width="96" height="96" rx="25" fill="#0d0b09"/>
              <ellipse id="w-halo" cx="0" cy="0" rx="62" ry="56" fill="url(#gGlowO)" opacity="0"/>
              <g id="w-lcdg" clip-path="url(#lcdClip)">
                <rect id="w-lcd" x="-40" y="-36" width="80" height="68" fill="url(#gLcd)"/>
                <g id="w-disp"></g>
                <g id="w-noise"></g>
                <rect id="w-scan" x="-40" y="-36" width="80" height="68" fill="url(#scn)" opacity="0"/>

              </g>
              <path d="M-44 -30 Q-44 -44 -30 -44 H10 L-44 10 Z" fill="url(#gGlare)"/>
            </g>
          </g>

          <!-- measurement & safety kit -->
          <g id="p-kit" filter="url(#sh)">
            <path d="M-80 70 C-90 100 -40 100 -30 120" stroke="#f09b74" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M-40 70 C-40 100 0 96 10 120" stroke="#9a8b78" stroke-width="4" fill="none" stroke-linecap="round"/>
            <rect x="-112" y="-72" width="104" height="146" rx="20" fill="#e8c68e" stroke="#a8874f" stroke-width="3"/>
            <rect x="-100" y="-60" width="80" height="34" rx="9" fill="#1f1a15"/>
            <text x="-60" y="-35" class="f-mono" font-size="21" font-weight="700" fill="#f2c35a" text-anchor="middle">0.00</text>
            <circle cx="-60" cy="16" r="24" fill="#2b241e"/>
            <path d="M-60 16 L-48 -2" stroke="#f6efe3" stroke-width="4" stroke-linecap="round"/>
            <circle cx="-80" cy="58" r="5" fill="#d97757"/>
            <circle cx="-40" cy="58" r="5" fill="#1a1612"/>
            <path d="M14 -46 h46 l10 8 l10 -8 h46 a14 14 0 0 1 14 14 v18 a14 14 0 0 1 -14 14 h-34 l-12 -10 -10 0 -12 10 h-34 a14 14 0 0 1 -14 -14 v-18 a14 14 0 0 1 14 -14z" fill="#ffffff" fill-opacity=".4" stroke="#8b7d68" stroke-width="4" stroke-linejoin="round"/>
            <path d="M0 -36 h-10 M140 -36 h10" stroke="#8b7d68" stroke-width="6" stroke-linecap="round"/>
            <path d="M30 30 L128 46 M30 30 L128 62" stroke="#cdbfa6" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M22 74 h46 v40 h-46 z" fill="#d97757"/>
            <path d="M68 78 h22 a6 6 0 0 1 0 12 h-22 M68 92 h26 a6 6 0 0 1 0 12 h-26" fill="#d97757"/>
          </g>

          <g id="pCoil"></g>
          <g id="pFlow"></g>
          <g id="scan"></g>
          <g id="rings"></g>
          <g id="fx"></g>
          <g id="comp"></g>
          <g id="benchLbl"></g>
          <g id="check" opacity="0" transform="translate(-160 0)">
            <rect x="600" y="222" width="196" height="50" rx="25" fill="#fffaf0" stroke="#b07b2e" stroke-width="2"/>
            <path d="M624 247 l9 9 l17 -19" stroke="#b07b2e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="662" y="254" font-size="19" font-weight="700" fill="#2b2118">단락 없음</text>
          </g>
          <text id="done" x="600" y="150" class="f-disp" font-size="54" fill="#cf5a33" text-anchor="middle" opacity="0">합체 완료</text>
        </g>

        <!-- HV module inset -->
        <g id="inset" opacity="0" transform="translate(22 41) scale(.85)">
          <circle cx="680" cy="175" r="128" fill="#fffaf0" stroke="#d9970f" stroke-width="2.5"/>
          <rect x="604" y="112" width="152" height="122" rx="10" fill="none" stroke="#6a5d50" stroke-width="14"/>
          <g id="prim"></g>
          <g id="sec"></g>
          <text x="604" y="268" font-size="18" font-weight="700" fill="#cf5a33" text-anchor="middle">1차</text>
          <text x="756" y="268" font-size="18" font-weight="700" fill="#b9780a" text-anchor="middle">2차</text>
          <text x="612" y="98" class="f-mono" font-size="18" font-weight="700" fill="#cf5a33" text-anchor="middle">3.7 V</text>
          <text x="748" y="98" font-size="18" font-weight="700" fill="#b9780a" text-anchor="middle">수만 V</text>
        </g>

        <!-- output voltage meter -->
        <g id="meter" opacity="0" transform="translate(-120 -20)">
          <rect x="566" y="508" width="228" height="92" rx="20" fill="#fffaf0" stroke="#d9970f" stroke-opacity=".8" stroke-width="2"/>
          <text x="586" y="538" font-size="16" font-weight="500" fill="#7a6a58">출력 전압</text>
          <text id="meterV" x="776" y="580" class="f-mono" font-size="28" font-weight="700" fill="#b9780a" text-anchor="end">3.7 V</text>
          <text x="680" y="626" font-size="16" fill="#7a6a58" text-anchor="middle">제품에 적힌 최댓값</text>
        </g>

        <!-- scene 1 info card -->
        <g id="card" opacity="0">
          <rect x="640" y="190" width="510" height="394" rx="28" fill="#fffaf0" stroke="#d8caaf" stroke-width="2"/>
          <g id="cDots"></g>
          <text id="cIdx" x="672" y="272" class="f-mono" font-size="16" font-weight="500" fill="#7a6a58" letter-spacing="1">전원</text>
          <text id="cName" x="672" y="330" class="f-disp" font-size="46" fill="#2b2118">18650 배터리</text>
          <text id="cSpec" x="672" y="372" font-size="21" font-weight="500" fill="#a9772e">3.7V</text>
          <line x1="672" y1="398" x2="1118" y2="398" stroke="#d8caaf" stroke-width="2"/>
          <text x="672" y="436" font-size="18" font-weight="700" fill="#cf5a33">용도</text>
          <text id="cU0" x="672" y="478" font-size="24" fill="#2b2118"></text>
          <text id="cU1" x="672" y="516" font-size="24" fill="#2b2118"></text>
          <text id="cU2" x="672" y="554" font-size="24" fill="#2b2118"></text>
        </g>

        <g id="panels"></g>

        <!-- scene 5 : what happens inside the watch -->
        <g id="nz" opacity="0">
          <rect x="40" y="112" width="392" height="496" rx="28" fill="#fffaf0" stroke="#d8caaf" stroke-width="2"/>
          <text x="68" y="160" class="f-disp" font-size="27" fill="#2b2118">시계 속에서 일어나는 일</text>
          <g id="nz1">
            <circle cx="88" cy="222" r="24" fill="#f1e6d0"/>

const bench = $("bench"), tray = $("tray"), card = $("card"), tcard = $("tcard");
const swLever = $("sw-lever"), swTxt = $("sw-txt"), swDot = $("sw-dot");
const batGlow = $("bat-glow"), hvGlow = $("hv-glow"), coilGlow = $("coil-glow");

const check = $("check"), done = $("done"), nz = $("nz"), nzWave = $("nzWave"), nz1 = $("nz1"), nz2 = $("nz2"), nz3 = $("nz3");

function place(el, x, y, s, r, o){ el.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(4)})`); op(el, o); }

function partState(k, T){
  const P = PARTS[k], i = ORDER.indexOf(k);
  const [lx, ly, ls] = P.layout, [tx, ty, ts] = P.tray, [sx, sy, ss] = P.show;
  if(T < ST[1]){
    const t = T - ST[0], a = 1.2 + i * 2.4;
    if(t < a) return [1340, sy, ss, 10, 0];
    const pin = eout(seg(t, a, a + .45)), pout = eio(seg(t, a + 1.85, a + 2.4));
    if(pout <= 0) return [lerp(1340, sx, pin), sy, ss, lerp(10, 0, pin), pin];
    return [lerp(sx, tx, pout), lerp(sy, ty, pout) - 70 * Math.sin(Math.PI * pout), lerp(ss, ts, pout), 0, 1];
  }
  if(k === "watch"){
    if(T < ST[2]) return [tx, ty, ts, 0, 1 - seg(T - ST[1], 16.3, 17)];
    if(T < ST[4]) return [lx, ly, ls, 0, 0];
    const t5 = T - ST[4], p = seg(t5, .3, 1.7);
    return [lx, lerp(-150, ly, eback(p)), lerp(1, 1.2, eio(seg(t5, 3, 5.8))), 0, seg(t5, .3, .8)];
  }
  if(T < ST[2]){
    const t = T - ST[1];
    const st = .6 + ({ bat: 0, sw: 1, hv: 2, coil: 3, kit: 4 })[k] * .8;
    const p = seg(t, st, st + 1.4);
    if(p <= 0) return [tx, ty, ts, 0, 1];
    const e = eio(p);
    return [lerp(tx, lx, e), lerp(ty, ly, e) - 130 * Math.sin(Math.PI * p), ts + (ls - ts) * eback(p), -28 * Math.sin(Math.PI * p), 1];
  }
  return [lx, ly, ls, 0, 1];
}

/* power, coil current, field and camera timelines */
function lever(T){
  const t3 = T - ST[2], t4 = T - ST[3], t5 = T - ST[4];
  if(T < ST[2]) return 0;
  if(T < ST[3]) return eio(seg(t3, .8, 1.3));
  if(T < ST[4]) return 1 - eio(seg(t4, 44.8, 45.4));
  return eio(seg(t5, 8, 8.35)) - eio(seg(t5, 21, 21.35));
}
function powerSince(T){
  if(T >= ST[2] && T < ST[3] + 45.2) return ST[2] + 1.4;
  if(T >= ST[4] + 8.2 && T < ST[4] + 21.4) return ST[4] + 8.35;
  return null;
}
function coilInfo(T){
  const t4 = T - ST[3], t5 = T - ST[4];
  if(T >= ST[3] && T < ST[4]){
    const t = t4 - .5; if(t < 0 || t4 > 45.5) return null;
    const D = t < 18 ? t : t < 20 ? 18 - (t - 18) : 16 + (t - 20);
    return { t, D, dir: (t >= 18 && t < 20) ? -1 : 1, a: 1 - seg(t4, 44.8, 45.4), r: seg(t, 2.5, 5.5) };
  }
  if(T >= ST[4]){
    const t = t5 - 8.4; if(t < 0 || t5 > 21.6) return null;
    return { t, D: t, dir: 1, a: 1 - seg(t5, 21, 21.5), r: seg(t, 0, .5) };
  }
  return null;
}
function fieldInfo(T){
  const t4 = T - ST[3], t5 = T - ST[4];
  if(T >= ST[3] && T < ST[4]) return { draw: t4 - 11.3, a: 1 - seg(t4, 44.6, 45.4) };
  if(T >= ST[4]) return { draw: (t5 - 8.5) * 2.2, a: 1 - seg(t5, 21, 21.8) };
  return null;
}
function camera(T){
  const t4 = T - ST[3], t5 = T - ST[4];
  if(T >= ST[3] && T < ST[4]){
    const z = 1 + .07 * eio(seg(t4, 0, 14)) - .07 * eio(seg(t4, 44, 47.5));
    return [760, 370, z, 760, 370];
  }
  if(T >= ST[4]){
    const zp = eio(seg(t5, 3, 5.8));
    return [lerp(600, 720, zp), lerp(370, 385, zp), lerp(1, 1.9, zp), lerp(600, 985, zp), 370];
  }
  return [600, 370, 1, 600, 370];
}
function coilPos(d){
  if(d < LA){ const p = at(T_A, d); return [p[0], p[1], 1]; }
  if(d < LA + LH) return helix((d - LA) / LH);
  const p = at(T_C, Math.min(LC, d - LA - LH)); return [p[0], p[1], 1];
}

/* ---------- render ---------- */
let lastCardIdx = -1, lastScene = -1, lastBeat = null, lastHs = "";
const subG = $("sub");
const subRect = mk("rect", { y: 20, height: 54, rx: 27, fill: "#fffaf0", "fill-opacity": .95, stroke: "#d8caaf", "stroke-width": 1.5 }, subG);

function render(T){
  const t1 = T - ST[0], t2 = T - ST[1], t3 = T - ST[2], t4 = T - ST[3], t5 = T - ST[4];
  const si = sceneAt(T);
  const noDots = T >= ST[4];  /* watch test: hide the moving current dots */

  /* camera */
  const cam = camera(T);
  bench.setAttribute("transform", `translate(${cam[0].toFixed(2)} ${cam[1].toFixed(2)}) scale(${cam[2].toFixed(4)}) translate(${-cam[3]} ${-cam[4]})`);

  /* parts */
  ORDER.forEach(k => { const s = partState(k, T); place(PARTS[k].el, s[0], s[1], s[2], s[3], s[4]); });
  op(tray, T < ST[1] ? seg(t1, 3.0, 3.4) : 1 - seg(t2, 16.3, 17));
  const wk = watchKind(T);
  renderWatch(T, wk);

  /* scene 1 info card */
  let cOp = 0, cs = 1;
  if(T < ST[1] && t1 >= 1.2){
    const i = Math.min(5, Math.floor((t1 - 1.2) / 2.4)), u = t1 - 1.2 - 2.4 * i;
    cOp = fade(u, .3, .65, 1.85, 2.2);
    cs = lerp(.94, 1, eout(seg(u, .3, .65)));
    if(i !== lastCardIdx){
      lastCardIdx = i; const c = CARDS[i];
      $("cIdx").textContent = `${c.cat}`;
      $("cName").textContent = c.name; $("cSpec").textContent = c.spec;
      [0, 1, 2].forEach(j => $("cU" + j).textContent = c.use[j] || "");
      cDotEls.forEach((d, j) => d.setAttribute("fill", j === i ? C.clay : (j < i ? "#cfa77f" : "#d8caaf")));
    }
  }
  card.setAttribute("transform", `translate(895 387) scale(${cs.toFixed(3)}) translate(-895 -387)`);
  op(card, cOp);

  /* wires */
  WIRES.forEach(w => {
    const p = T < ST[1] ? 0 : T < ST[2] ? eio(seg(t2, w.draw[0], w.draw[1])) : 1;
    [w.outer, w.inner].forEach(e => { e.setAttribute("stroke-dasharray", `${w.L} ${w.L}`); e.setAttribute("stroke-dashoffset", (w.L * (1 - p)).toFixed(2)); });
    op(w.g, p > 0 ? 1 : 0);
  });

  /* scene 2: snaps, scan, check */
  SNAPS.forEach(s => {
    const p = (T >= ST[1] && T < ST[2]) ? seg(t2, s.t, s.t + .6) : 0;
    if(p > 0 && p < 1){ s.el.setAttribute("r", (10 + 50 * p).toFixed(1)); op(s.el, 1 - p); } else op(s.el, 0);
  });
  WIRES.forEach((w, j) => {
    const a = 17.5 + j * .4, p = (T >= ST[1] && T < ST[2]) ? seg(t2, a, a + 1.4) : 0;
    if(p > 0 && p < 1){ w.scan.setAttribute("stroke-dasharray", `44 ${w.L + 60}`); w.scan.setAttribute("stroke-dashoffset", (44 - p * (w.L + 44)).toFixed(1)); op(w.scan, .95); } else op(w.scan, 0);
  });
  op(check, T >= ST[1] && T < ST[2] ? fade(t2, 19, 19.4, 21.5, 21.9) : 0);
  op(done, T >= ST[1] && T < ST[2] ? fade(t2, 20.5, 20.9, 21.5, 21.95) : 0);

  /* switch + power */
  const lev = lever(T);
  swLever.setAttribute("transform", `rotate(${lerp(-30, 30, lev).toFixed(1)} 0 -28)`);
  swTxt.textContent = lev > .5 ? "ON" : "OFF";
  swTxt.setAttribute("fill", lev > .5 ? "#f09b74" : "#a89c8a");
  swDot.setAttribute("fill", mix("#3d352c", "#f09b74", lev));
  const since = powerSince(T);
  const flowT = since == null ? -1 : T - since;
  op(batGlow, .55 * lev);
  poolIn.forEach((c, k) => {
    const d = flowT >= 0 ? flowT * 240 - k * GAP_IN : -1;
    if(d < 0){ op(c, 0); return; }
    const p = at(T_IN, d % L_IN); c.setAttribute("cx", p[0].toFixed(1)); c.setAttribute("cy", p[1].toFixed(1)); op(c, noDots ? 0 : lev);
  });
  poolRet.forEach((c, k) => {
    const d = flowT >= 0 ? (flowT - 2.2) * 240 - k * GAP_RET : -1;
    if(d < 0){ op(c, 0); return; }
    const p = at(T_RET, d % L_RET); c.setAttribute("cx", p[0].toFixed(1)); c.setAttribute("cy", p[1].toFixed(1)); op(c, noDots ? 0 : .8 * lev);
  });
  op(hvGlow, flowT >= 0 ? seg(flowT, 2.2, 3.2) * (.35 + .25 * Math.sin(T * 26)) * lev : 0);
  op(lblCur, fade(t3, 3, 3.5, 18.5, 19));
  op(lblRet, fade(t3, 4.5, 5, 18.5, 19));

  /* HV inset + meter (scene 3) */
  op(inset, fade(t3, 9, 9.5, 14.6, 15.1));
  if(t3 > 9 && t3 < 15.2){
    const pulse = Math.floor(T * 10) % 2 === 0;
    prim.forEach(e => e.setAttribute("stroke", pulse ? C.clayHi : "#d98a52"));
    sec.forEach(e => e.setAttribute("stroke", pulse ? C.gold : "#8a5a33"));
  }
  op(meter, fade(t3, 15, 15.4, 19.1, 19.5));
  if(t3 >= 15 && t3 < 19.6){
    const v = 3.7 * Math.pow(1e6 / 3.7, eio(seg(t3, 15.3, 18)));
    meterV.textContent = (v < 100 ? v.toFixed(1) : Math.round(v).toLocaleString("ko-KR")) + " V";
  }

  /* zaps around the module */
  const zapOn = (t3 > 15.5 && t3 < 19.2) || (t4 > 0 && t4 < 3.5) || (t5 > 8.35 && t5 < 10.2 && T >= ST[4]);
  const zs = Math.floor(T * 16);
  zaps.forEach((zp2, i) => {
    if(!zapOn || rnd(zs * 3 + i) < .35){ op(zp2, 0); return; }
    const y1 = 322 + rnd(zs + i * 11) * 100, ang = -1.1 + rnd(zs + i * 5) * 2.2, len = 40 + rnd(zs + i * 9) * 50;
    zp2.setAttribute("points", zapPts(680, y1, 680 + Math.cos(ang) * len, y1 + Math.sin(ang) * len, zs * 13 + i, 6, 9));
    op(zp2, .95);
  });

  /* voltage ladder */
  op(VP.g, fade(t3, 19, 19.6, 30.6, 31.1));
  VP.rows.forEach((r, i) => {
    const a = 19.6 + i * 1.15;
    op(r.rg, seg(t3, a, a + .3));
    r.bar.setAttribute("width", ((r.bx1 - r.bx0) * eout(seg(t3, a, a + .9))).toFixed(1));
    if(r.tag) op(r.tag, seg(t3, i === 6 ? 29.5 : a + .7, i === 6 ? 30 : a + 1));
  });
  op(ghost, seg(t3, 29.5, 30));

  /* elephant */
  op(EP, fade(t3, 31, 31.5, 36.6, 37.1));
  if(t3 > 31 && t3 < 37.2){
    const flash = t3 > 31.8 && t3 < 35 && rnd(Math.floor(T * 10)) > .4;
    op(elBolt, flash ? 1 : .08);
    const sh = flash ? Math.sin(T * 70) * 4 : 0;
    elBody.setAttribute("transform", `translate(${330 + sh} 420) scale(3.4)`);
    const at = [31.6, 32.2, 32.4, 33, 33.3, 34, 34.2, 35.5];
    EL.forEach((e, i) => op(e, seg(t3, at[i], at[i] + .4)));
  }

  /* reality */
  op(RP, fade(t3, 37, 37.5, 45.6, 46.1));
  if(t3 > 37 && t3 < 46.2){
    op(R1, seg(t3, 37.8, 38.1)); rb1.setAttribute("width", ((CX(.1) - 450) * eout(seg(t3, 38, 39.2))).toFixed(1));
    op(R2, seg(t3, 39.3, 39.6)); rb2.setAttribute("width", ((CX(5e-6) - 450) * eout(seg(t3, 39.5, 40.7))).toFixed(1));
    op(rRatio, seg(t3, 41, 41.4));
    op(rCow, seg(t3, 41.8, 42.2));
    const zf = t3 > 42.2 && rnd(Math.floor(T * 12)) > .45;
    fenceZap.setAttribute("points", zf ? zapPts(176, 470, 214, 520, Math.floor(T * 12), 5, 8) : "");
    op(ouch, zf ? 1 : .35);
    fenceW.forEach(l => l.setAttribute("stroke", zf ? "#f2a516" : "#8a7a66"));
    rT.forEach((e, i) => op(e, seg(t3, [42, 42.4, 42.8, 43.1][i], [42, 42.4, 42.8, 43.1][i] + .4)));
  }

  /* coil current, glow */
  const cp = coilInfo(T);
  poolCoil.forEach((c, k) => {
    if(!cp){ op(c, 0); return; }
    let d = cp.D * 480 - k * GAP_COIL;
    if(cp.t < 12 && d < 0){ op(c, 0); return; }
    d = ((d % L_COIL) + L_COIL) % L_COIL;
    const p = coilPos(d);
    c.setAttribute("cx", p[0].toFixed(1)); c.setAttribute("cy", p[1].toFixed(1));
    const front = p[2] >= 0;
    c.setAttribute("r", front ? 6 : 4);
    op(c, noDots ? 0 : (front ? 1 : .4) * cp.a);
  });
  op(coilGlow, cp ? cp.r * cp.a * (.3 + .22 * Math.abs(Math.sin(T * 11))) : 0);
  op(lblHV, fade(t4, .4, .9, 10.5, 11));

  /* field lines */
  const fi = fieldInfo(T);
  const dir = cp ? cp.dir : 1, D = cp ? cp.D : 0;
  FL.forEach((pth, j) => {
    if(!fi || fi.a <= 0){ op(pth, 0); return; }
    const L = pth._L, p = seg(fi.draw, j * .22, 1.5 + j * .22);
    if(p <= 0){ op(pth, 0); return; }
    if(p < 1){
      pth.setAttribute("stroke-dasharray", `${L} ${L}`); pth.setAttribute("stroke-dashoffset", (L * (1 - eio(p))).toFixed(1));
      pth.removeAttribute("marker-mid"); op(pth, .85 * fi.a);
    } else {
      pth.setAttribute("stroke-dasharray", "16 12"); pth.setAttribute("stroke-dashoffset", (-D * 55).toFixed(1));
      pth.setAttribute("marker-mid", dir > 0 ? "url(#mF)" : "url(#mR)");
      op(pth, (T >= ST[4] ? .42 + .25 * Math.abs(Math.sin(T * 9)) : .6 + .3 * Math.abs(Math.sin(T * 9))) * fi.a);
    }
  });
  const flipP = (T >= ST[3] && T < ST[4]) ? eio(seg(t4, 18.5, 18.9)) - eio(seg(t4, 20.5, 20.9)) : 0;
  const nsOp = (T >= ST[3] && T < ST[4]) ? fade(t4, 13, 13.5, 44, 44.6) : 0;
  op(lblN.g, nsOp); op(lblS.g, nsOp);
  lblN.t.textContent = flipP > .5 ? "−" : "+"; lblS.t.textContent = flipP > .5 ? "+" : "−";
  lblN.c.setAttribute("fill", flipP > .5 ? C.sand : C.clay); lblS.c.setAttribute("fill", flipP > .5 ? C.clay : C.sand);
  COMPS.forEach(c => {
    const vis = (T >= ST[3] && T < ST[4]) ? fade(t4, 10.5, 11, 44, 44.6) : 0;
    op(c.g, vis);
    const a = lerp(150, c.a, eio(seg(t4, 12.5, 14))) + 180 * flipP;
    c.n.setAttribute("transform", `rotate(${a.toFixed(1)})`);
  });

  /* magnetic ladder */
  const inS4 = T >= ST[3] && T < ST[4];
  op(MP.g, inS4 ? fade(t4, 22, 22.6, 35.6, 36.1) : 0);
  MP.rows.forEach((r, i) => {
    const a = 22.8 + i * 1.3;
    op(r.rg, inS4 ? seg(t4, a, a + .3) : 0);
    r.bar.setAttribute("width", ((r.bx1 - r.bx0) * (inS4 ? eout(seg(t4, a, a + .9)) : 0)).toFixed(1));
    if(r.tag) op(r.tag, inS4 ? seg(t4, a + .7, a + 1) : 0);
  });
  op(mBox, inS4 ? seg(t4, 31.5, 32) : 0);

  op(mgG, inS4 ? fade(t4, 12.6, 13.1, 21.4, 21.9) : 0);

  /* spark panel */
  op(AP, inS4 ? fade(t4, 36, 36.5, 43.8, 44.4) : 0);
  if(inS4 && t4 > 36){
    op(dGap, seg(t4, 36.5, 36.9));
    dArrows.forEach((l, i) => { l.setAttribute("stroke-dashoffset", (-T * 40).toFixed(1)); op(l, seg(t4, 36.7 + i * .1, 37.1 + i * .1)); });
    const ion = seg(t4, 38.4, 38.8);
    dMol.forEach((m, i) => { op(m, seg(t4, 37, 37.4)); m.setAttribute("fill", i < 10 ? mix("#cdbfa6", "#d97757", ion) : "#cdbfa6"); });
    dEl.forEach((e, i) => {
      const m = dMol[i]; let x = parseFloat(m.getAttribute("cx")) - 170 * Math.max(0, t4 - 38.4);
      while(x < 215) x += 770;
      e.setAttribute("cx", x.toFixed(1)); e.setAttribute("cy", m.getAttribute("cy")); op(e, ion);
    });
    const sp = t4 > 40.6 && t4 < 43.8 && rnd(Math.floor(T * 14)) > .25;
    dSpark.setAttribute("points", sp ? zapPts(190, 300, 1010, 300, Math.floor(T * 14) * 7, 14, 28) : "");
    op(dSpark, sp ? 1 : 0);
    op(dT[0], seg(t4, 36.6, 37)); op(dT[1], seg(t4, 38.4, 38.8)); op(dT[2], seg(t4, 40.6, 41));
  }

  /* scene 5: EMI waves, HUD, explanation card */
  const s5on = T >= ST[4];
  emi.forEach((e, i) => {
    const active = s5on && t5 > 8.4 && t5 < 21.6;
    if(!active){ op(e, 0); return; }
    const p = ((t5 - 8.4) * .9 + i / 3) % 1;
    e.setAttribute("rx", lerp(80, 380, p).toFixed(1)); e.setAttribute("ry", lerp(130, 300, p).toFixed(1));
    op(e, (1 - p) * .55 * (1 - seg(t5, 21, 21.6)));
  });
  op(hud, s5on ? seg(t5, 3, 3.6) : 0);
  hTrack.setAttribute("fill", mix("#cfc2a8", "#d97757", lev));
  hKnob.setAttribute("cx", lerp(65, 103, lev).toFixed(1));
  hPow.textContent = lev > .5 ? "전원 ON" : "전원 OFF";
  hPow.setAttribute("fill", lev > .5 ? C.clayHi : C.muted);
  let hs = "ok";
  if(wk === "glitch") hs = "bad"; else if(wk === "blank" || wk === "test") hs = "boot"; else if(s5on && t5 >= 22.9) hs = "fixed";
  if(hs !== lastHs){
    lastHs = hs;
    const m = { ok: ["정상 작동", C.sand], bad: ["화면 이상!", C.danger], boot: ["다시 시작 중", C.gold], fixed: ["복구 완료", C.sand] }[hs];
    hsTxt.textContent = m[0]; hsTxt.setAttribute("fill", m[1]); hsDot.setAttribute("fill", m[1]); hsBox.setAttribute("stroke", m[1]);
  }
  op(nz, s5on ? fade(t5, 12, 12.6, 19.8, 20.4) : 0);
  if(s5on && t5 > 12 && t5 < 20.5){
    op(nz1, seg(t5, 12.4, 12.9)); op(nz2, seg(t5, 14, 14.5)); op(nz3, seg(t5, 16.4, 16.9));
    const N = 56, pts = [];
    for(let i = 0; i <= N; i++){
      const spike = (rnd(Math.floor(T * 22) * 97 + i) - .5) * (i % 6 === 0 ? 70 : 24);
      const y = 402 + clamp(14 * Math.sin(i * .55 + T * 12) + spike, -36, 36);
      pts.push(`${(76 + i * (320 / N)).toFixed(1)},${y.toFixed(1)}`);
    }
    nzWave.setAttribute("points", pts.join(" "));
  }

  /* scene title card */
  const sc = SCENES[si], tl = T - sc.start;
  if(si !== lastScene){ lastScene = si; $("tcK").textContent = "PART " + (si + 1); $("tcN").textContent = sc.card; }
  const tco = si === 0 ? fade(tl, -1, 0, 1.0, 1.5) : fade(tl, 0, .2, .85, 1.1);
  op(tcard, tco);
  tcIn.setAttribute("transform", `translate(0 ${lerp(26, 0, eout(seg(tl, 0, .6))).toFixed(1)})`);
  const lw = 180 * eout(seg(tl, .15, .8));
  tcL.setAttribute("x", (600 - lw / 2).toFixed(1)); tcL.setAttribute("width", lw.toFixed(1));

  /* subtitle */
  let b = sc.beats[0];
  for(const x of sc.beats) if(tl >= x.t) b = x;
  if(b !== lastBeat){ lastBeat = b; setSub(b.title); }

  /* UI */
  scrub.value = R.toFixed(1);
  clock.textContent = `${fmt(R)} / ${fmt(TOTAL_R)}`;
}
function fmt(s){ s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

/* ---------- controls ---------- */
const scrub = $("scrub"), clock = $("clock"), playBtn = $("play"), playTxt = $("playTxt"), playIcon = $("playIcon");
/* time warp: script time -> real playback time, so slow stretches are cut short (segments are [script s, real s]) */
const SEGS = [[15.6, 14],
  [1.1, .8], [4.9, 2.5], [8.4, 4.2], [3.1, 1.2], [4.5, 2.6],
  [1.1, .8], [7.9, 3.2], [6, 2.8], [4.5, 3], [11.5, 11], [6, 5], [9, 7.5],
  [1.1, .8], [9.9, 4.2], [11, 6.5], [14, 12], [8.4, 7], [3.6, 1.6],
  [1.1, .8], [6.9, 3.2], [13.3, 6.6], [5.6, 3.2], [7.1, 2.6]];
const WS = [0], WR = [0];
SEGS.forEach(g => { WS.push(WS[WS.length - 1] + g[0]); WR.push(WR[WR.length - 1] + g[1]); });
const TOTAL_R = WR[WR.length - 1];
function warp(x, A, B){ if(x <= 0) return 0; if(x >= A[A.length - 1]) return B[B.length - 1]; let i = 0; while(A[i + 1] < x) i++; return B[i] + (x - A[i]) / (A[i + 1] - A[i]) * (B[i + 1] - B[i]); }
const R2S = r => warp(r, WR, WS), S2R = t => warp(t, WS, WR);
scrub.max = TOTAL_R;
let R = 0, T = 0, playing = false, lastTs = null;
function sync(){ T = R2S(R); render(T); }
function setPlaying(v){
  playing = v;
  if(v && R >= TOTAL_R - .01) R = 0;
  const ended = !v && R >= TOTAL_R - .01;
  playTxt.textContent = v ? "일시정지" : (ended ? "다시 보기" : "재생");
  playBtn.setAttribute("aria-label", playTxt.textContent);
  playIcon.setAttribute("d", v ? "M2.5 1.5 H5.5 V12.5 H2.5 Z M8.5 1.5 H11.5 V12.5 H8.5 Z" : "M3 1.5 L12 7 L3 12.5 Z");
  lastTs = null;
  if(typeof wake === "function" && typeof idleT !== "undefined") wake();
}
let fAvg = 16.7, fN = 0, lite = false;
function frame(ts){
  if(playing){
    if(lastTs != null){
      const dt = ts - lastTs;
      R = Math.min(TOTAL_R, R + Math.min(.1, dt / 1000));
      fAvg = fAvg * .92 + dt * .08;
      if(++fN > 60 && fAvg > 26 && !lite){ lite = true; $("svg").classList.add("lite"); }
    }
    lastTs = ts;
    if(R >= TOTAL_R){ R = TOTAL_R; setPlaying(false); }
    sync();
  } else renderWatch(T, watchKind(T));
  requestAnimationFrame(frame);
}
playBtn.addEventListener("click", () => setPlaying(!playing));
scrub.addEventListener("input", () => { R = parseFloat(scrub.value) || 0; if(!playing) setPlaying(false); sync(); });
document.addEventListener("keydown", e => {
  if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") && e.key === " ") return;
  if(e.key === " "){ e.preventDefault(); setPlaying(!playing); }
  else if(e.key === "ArrowRight" && e.target.tagName !== "INPUT"){ R = Math.min(TOTAL_R, R + 3); sync(); }
  else if(e.key === "ArrowLeft" && e.target.tagName !== "INPUT"){ R = Math.max(0, R - 3); sync(); }
});

/* fullscreen: native API when allowed, otherwise a viewport-filling mode; portrait phones can rotate the stage */
const playerEl = $("player"), fsBtn = $("fs"), rotBtn = $("rot"), fsIcon = $("fsIcon"), fsTxt = $("fsTxt");
const FS_ON = "M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4", FS_OFF = "M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4";
let isFull = false, rotPref = null, nativeSeen = false;
function applyRot(){
  const portrait = window.innerHeight > window.innerWidth;
  playerEl.classList.toggle("rot", isFull && (rotPref === null ? portrait : rotPref));
  rotBtn.hidden = !isFull;
}
let idleT = null;
function wake(){
  playerEl.classList.remove("idle"); clearTimeout(idleT);
  if(isFull && playing) idleT = setTimeout(() => playerEl.classList.add("idle"), 2500);
}
["pointerdown", "pointermove", "keydown", "touchstart"].forEach(ev => playerEl.addEventListener(ev, wake, { passive: true }));
function setFull(v){
  isFull = v; fN = 0; fAvg = 16.7;
  playerEl.classList.toggle("full", v);
  document.documentElement.classList.toggle("lock", v);
  fsIcon.setAttribute("d", v ? FS_OFF : FS_ON);
  fsTxt.textContent = v ? "나가기" : "전체화면";
  fsBtn.setAttribute("aria-label", fsTxt.textContent);
  if(v){
    try { const r = playerEl.requestFullscreen && playerEl.requestFullscreen(); if(r && r.catch) r.catch(() => {}); } catch(e){}
  } else {
    rotPref = null; nativeSeen = false;
    try { if(document.fullscreenElement){ const r = document.exitFullscreen(); if(r && r.catch) r.catch(() => {}); } } catch(e){}
  }
  applyRot(); wake();
}
fsBtn.addEventListener("click", () => setFull(!isFull));
rotBtn.addEventListener("click", () => { rotPref = !playerEl.classList.contains("rot"); applyRot(); });
document.addEventListener("fullscreenchange", () => { if(document.fullscreenElement) nativeSeen = true; else if(isFull && nativeSeen) setFull(false); });
window.addEventListener("resize", applyRot);
document.addEventListener("keydown", e => { if(e.key === "Escape" && isFull) setFull(false); });

window.__anim = { seek(t){ R = S2R(t); sync(); }, total: TOTAL_R, starts: ST, script: TOTAL };

sync();
let reduce = false;
try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}
setPlaying(!reduce);
requestAnimationFrame(frame);
})();
</script>

</body>
