<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>간이 전동기 원리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
</head>
<body>
<style>
/* One beige stage + one transport bar (play, seek, time, fullscreen). Palette = Claude clay orange + ochre/kraft. */
:root{
  --bg:#f2eadb; --surface:#fbf6ea; --surface-2:#efe5d0; --line:#d8caaf;
  --ink:#2b2118; --muted:#7a6a58; --clay:#d97757; --clay-hi:#f09b74; --sand:#a9772e; --kraft:#c9976b;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
.page{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;min-height:100svh;box-sizing:border-box;display:grid;align-content:center}
.rig{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.stage{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#ece2cd;box-shadow:0 30px 60px -36px rgba(90,60,20,.35)}
.stage svg{display:block;width:100%;height:auto}
svg text{font-family:var(--f-body)}
.f-disp{font-weight:800;letter-spacing:-.01em}
.f-mono{font-family:var(--f-mono)}
.bar{min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.btn{white-space:nowrap;font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{border-color:var(--kraft)}
.btn.primary{background:var(--clay);border-color:var(--clay);color:#2b1308;font-weight:700;min-width:124px;justify-content:center}
.btn.primary:hover{background:var(--clay-hi);border-color:var(--clay-hi)}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn.icon{padding:8px 12px;flex:none}
.btn.icon svg{width:16px;height:16px}
html.lock,html.lock body{overflow:hidden}
.player.full{position:fixed;inset:0;z-index:50;background:var(--bg);padding:max(8px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.player.full .rig{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px}
.player.full .bar{position:absolute;left:12px;right:12px;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:2;background:rgba(251,246,234,.97);transition:opacity .25s}
.player.full.idle .bar{opacity:0;pointer-events:none}
.player.full .stage{flex:1 1 auto;min-height:0;display:flex;border-radius:0;border:0;box-shadow:none;background:transparent}
.player.full .stage svg{width:100%;height:100%}
.player.full.rot{padding:0}
.player.full.rot .rig{position:absolute;top:0;left:0;width:100vh;height:100vw;box-sizing:border-box;padding:8px 12px;transform-origin:0 0;transform:translateX(100vw) rotate(90deg)}
svg.lite [filter]{filter:none}
.scrub{flex:1 1 120px;min-width:60px;accent-color:var(--clay)}
.clock{white-space:nowrap;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.btn[hidden]{display:none}
.btn.on{background:var(--clay);border-color:var(--clay);color:#2b1308}
:focus-visible{outline:2px solid var(--sand);outline-offset:2px}
@media (max-width:600px){
  .bar{padding:8px 10px;gap:8px}
  .clock{min-width:0;font-size:12px}
  .btn.primary{min-width:0;padding:10px 16px}
  .btn.icon .t{display:none}
  #playTxt{display:none}
}
</style>

<div class="page">
  <section class="player" id="player" aria-label="애니메이션 플레이어">
   <div class="rig">
    <div class="stage">
      <svg id="svg" viewBox="0 0 1200 720" role="img" aria-label="건전지, 에나멜선 코일, 자석, 금속 받침대로 만드는 간이 전동기의 원리 설명 애니메이션">
        <defs>
          <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="18" cy="18" r="1.4" fill="#d9cbb0"/></pattern>
          <radialGradient id="glowA" cx="50%" cy="62%" r="55%"><stop offset="0" stop-color="#d97757" stop-opacity=".12"/><stop offset="1" stop-color="#d97757" stop-opacity="0"/></radialGradient>
          <radialGradient id="glowB" cx="86%" cy="20%" r="45%"><stop offset="0" stop-color="#ffffff" stop-opacity=".5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
          <linearGradient id="gBat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4a47f"/><stop offset=".45" stop-color="#d97757"/><stop offset="1" stop-color="#a8543a"/></linearGradient>
          <linearGradient id="gMag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b665e"/><stop offset="1" stop-color="#2f2c28"/></linearGradient>
          <linearGradient id="gMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f8270"/><stop offset=".5" stop-color="#d8ccb6"/><stop offset="1" stop-color="#8f8270"/></linearGradient>
          <radialGradient id="gGlowO"><stop offset="0" stop-color="#f09b74" stop-opacity=".8"/><stop offset=".55" stop-color="#f09b74" stop-opacity=".3"/><stop offset="1" stop-color="#f09b74" stop-opacity="0"/></radialGradient>
          <radialGradient id="gHeat"><stop offset="0" stop-color="#ee5b3d" stop-opacity=".55"/><stop offset="1" stop-color="#ee5b3d" stop-opacity="0"/></radialGradient>
          <marker id="mS" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#a9772e"/></marker>
          <marker id="mC" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#cf5a33"/></marker>
          <marker id="mK" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#2b2118"/></marker>
          <marker id="mM" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#7a6a58"/></marker>
        </defs>

        <rect width="1200" height="720" fill="#ece2cd"/>
        <rect width="1200" height="720" fill="url(#dots)"/>
        <rect width="1200" height="720" fill="url(#glowA)"/>
        <rect width="1200" height="720" fill="url(#glowB)"/>

        <g id="tray" opacity="0">
          <rect x="40" y="585" width="1120" height="112" rx="26" fill="#f7f0e0" stroke="#d9cbb0" stroke-width="2"/>
          <text x="66" y="613" font-size="16" font-weight="700" fill="#8a7a66" letter-spacing="2">준비물</text>
        </g>

        <g id="bench">
          <g id="fieldF"></g>

          <!-- battery holder -->
          <g id="p-hold">
            <ellipse cx="0" cy="60" rx="210" ry="10" fill="#3a2410" opacity=".12"/>
            <rect x="-202" y="-6" width="404" height="60" rx="12" fill="#2d2721" stroke="#4b4036" stroke-width="1.5"/>
            <rect x="-202" y="-52" width="28" height="106" rx="9" fill="#3a322b"/>
            <rect x="174" y="-52" width="28" height="106" rx="9" fill="#3a322b"/>
            <path d="M-174 -18 l6 6 -6 6 6 6 -6 6 6 6" stroke="#cdbfa6" stroke-width="3" fill="none"/>
            <rect x="168" y="-16" width="6" height="32" rx="2" fill="#cdbfa6"/>
            <text x="-150" y="40" font-size="22" font-weight="800" fill="#e8dcc4" text-anchor="middle">−</text>
            <text x="150" y="40" font-size="22" font-weight="800" fill="#f09b74" text-anchor="middle">+</text>
          </g>

          <!-- AA battery -->
          <g id="p-bat">
            <rect x="-174" y="-40" width="348" height="80" rx="16" fill="url(#gBat)" stroke="#8a3f26" stroke-width="1.5"/>
            <rect x="-174" y="-40" width="60" height="80" rx="16" fill="#2f2924"/>
            <rect x="-130" y="-40" width="16" height="80" fill="#2f2924"/>
            <rect x="174" y="-13" width="11" height="26" rx="4" fill="#ddcbab"/>
            <rect x="-110" y="-32" width="270" height="9" rx="4.5" fill="#fff" opacity=".22"/>
            <text x="20" y="10" class="f-mono" font-size="26" font-weight="700" fill="#2c1409" text-anchor="middle">AA 1.5V</text>
            <text x="148" y="11" font-size="30" font-weight="800" fill="#2c1409" text-anchor="middle">+</text>
            <text x="-144" y="11" font-size="30" font-weight="800" fill="#e8dcc4" text-anchor="middle">−</text>
          </g>

          <!-- round magnet (front view of a disc) -->
          <g id="p-mag">
            <rect x="-52" y="-14" width="104" height="28" rx="5" fill="url(#gMag)" stroke="#24211e" stroke-width="1.5"/>
            <rect x="-46" y="-11" width="92" height="4" rx="2" fill="#fff" opacity=".18"/>
            <g id="magPole" opacity="0">
              <text x="0" y="8" font-size="18" font-weight="800" fill="#f3c9a8" text-anchor="middle">N (예시)</text>
            </g>
          </g>

          <!-- enamel coil -->
          <g id="p-coil">
            <ellipse id="coilGlow" cx="0" cy="0" rx="110" ry="90" fill="url(#gGlowO)" opacity="0"/>
            <g id="cTurns"></g>
            <g id="cBack"></g>
            <g id="cLegs">
              <line id="legL" x1="-44" y1="0" x2="-252" y2="0" stroke="#8a4a22" stroke-width="5.5" stroke-linecap="round"/>
              <line id="legRb" x1="44" y1="1.4" x2="252" y2="1.4" stroke="#8a4a22" stroke-width="2.8" stroke-linecap="round"/>
              <line id="legRt" x1="44" y1="-1.4" x2="252" y2="-1.4" stroke="#8a4a22" stroke-width="2.8" stroke-linecap="round"/>
            </g>
            <g id="cFront"></g>
            <g id="cTies" opacity="0">
              <rect x="-50" y="-8" width="12" height="16" rx="3" fill="#7a3f1c"/>
              <rect x="38" y="-8" width="12" height="16" rx="3" fill="#7a3f1c"/>
              <path d="M-48 -8 v16 M-44 -8 v16 M-40 -8 v16 M40 -8 v16 M44 -8 v16 M48 -8 v16" stroke="#c77a45" stroke-width="1.6"/>
            </g>
            <circle id="cMark" cx="0" cy="-44" r="6" fill="#f2c35a" stroke="#7a4a10" stroke-width="2" opacity="0"/>
          </g>

          <!-- metal stands -->
          <g id="p-brL">
            <rect x="-14" y="182" width="28" height="10" rx="3" fill="#8f8270"/>
            <rect x="-4.5" y="10" width="9" height="176" rx="3" fill="url(#gMetal)" stroke="#6e6252" stroke-width="1"/>
            <circle cx="0" cy="0" r="11" fill="none" stroke="#8f8270" stroke-width="6"/>
          </g>
          <g id="p-brR">
            <rect x="-14" y="182" width="28" height="10" rx="3" fill="#8f8270"/>
            <rect x="-4.5" y="10" width="9" height="176" rx="3" fill="url(#gMetal)" stroke="#6e6252" stroke-width="1"/>
            <circle cx="0" cy="0" r="11" fill="none" stroke="#8f8270" stroke-width="6"/>
          </g>

          <!-- wire spool (scene 1 only) -->
          <g id="p-wire">
            <ellipse cx="0" cy="0" rx="50" ry="44" fill="none" stroke="#7a3f1c" stroke-width="6"/>
            <ellipse cx="3" cy="-2" rx="45" ry="40" fill="none" stroke="#a3592b" stroke-width="5"/>
            <ellipse cx="-2" cy="2" rx="40" ry="35" fill="none" stroke="#c46d38" stroke-width="5"/>
            <ellipse cx="1" cy="0" rx="35" ry="30" fill="none" stroke="#a3592b" stroke-width="4"/>
            <path d="M48 10 C70 20 76 44 98 46" stroke="#a3592b" stroke-width="5" fill="none" stroke-linecap="round"/>
          </g>

          <!-- sandpaper -->
          <g id="p-paper">
            <rect x="-62" y="-46" width="124" height="92" rx="8" fill="#c9a46b" stroke="#8a6a3a" stroke-width="2"/>
            <g id="grit"></g>
          </g>

          <g id="insets" opacity="0"></g>
          <g id="flow"></g>
          <g id="rings"></g>
          <g id="benchLbl"></g>
          <path id="finger" d="M0 0 C-6 -10 2 -20 14 -18 L120 -2 C134 0 134 26 120 28 L14 22 C2 22 -6 12 0 0 Z" fill="#e9c4a0" stroke="#a5765a" stroke-width="2" opacity="0"/>
          <text id="done" x="600" y="160" class="f-disp" font-size="54" fill="#cf5a33" text-anchor="middle" opacity="0">조립 완료</text>
        </g>

        <!-- scene 1 info card -->
        <g id="card" opacity="0">
          <rect x="640" y="190" width="510" height="370" rx="28" fill="#fffaf0" stroke="#d8caaf" stroke-width="2"/>
          <g id="cDots"></g>
          <text id="cIdx" x="672" y="272" class="f-mono" font-size="16" font-weight="500" fill="#7a6a58" letter-spacing="1"></text>
          <text id="cName" x="672" y="330" class="f-disp" font-size="42" fill="#2b2118"></text>
          <text id="cSpec" x="672" y="370" font-size="20" font-weight="500" fill="#a9772e"></text>
          <line x1="672" y1="396" x2="1118" y2="396" stroke="#d8caaf" stroke-width="2"/>
          <text x="672" y="434" font-size="18" font-weight="700" fill="#cf5a33">무엇에 쓰나</text>
          <text id="cU0" x="672" y="476" font-size="24" fill="#2b2118"></text>
          <text id="cU1" x="672" y="514" font-size="24" fill="#2b2118"></text>
        </g>

        <g id="panels"></g>

        <!-- scene 5 HUD -->
        <g id="hud" opacity="0">
          <rect x="36" y="96" width="250" height="54" rx="27" fill="#fffaf0" fill-opacity=".95" stroke="#d8caaf" stroke-width="2"/>
          <circle id="hBatDot" cx="66" cy="123" r="9" fill="#d97757"/>
          <text id="hBat" x="86" y="131" font-size="21" font-weight="700" fill="#2b2118">건전지: 끼움</text>
          <rect id="hsBox" x="864" y="96" width="300" height="54" rx="27" fill="#fffaf0" fill-opacity=".95" stroke="#a9772e" stroke-width="2"/>
          <circle id="hsDot" cx="894" cy="123" r="9" fill="#a9772e"/>
          <text id="hsTxt" x="914" y="131" font-size="21" font-weight="700" fill="#a9772e">코일: 멈춤</text>
        </g>

        <g id="sub"></g>

        <!-- scene title card -->
        <g id="tcard" opacity="0">
          <rect width="1200" height="720" fill="#efe6d3" fill-opacity=".92"/>
          <g id="tcIn">
            <rect x="514" y="290" width="172" height="42" rx="21" fill="#fffaf0" stroke="#d0bfa0" stroke-width="1.5"/>
            <text id="tcK" x="600" y="317" class="f-mono" font-size="17" font-weight="700" fill="#cf5a33" text-anchor="middle" letter-spacing="3">PART 1</text>
            <text id="tcN" x="600" y="410" class="f-disp" font-size="64" fill="#2b2118" text-anchor="middle"></text>
            <rect id="tcL" x="600" y="436" width="0" height="5" rx="2.5" fill="#d97757"/>
          </g>
        </g>
      </svg>
    </div>

    <div class="bar">
      <button class="btn primary" id="play" type="button" aria-label="재생">
        <svg viewBox="0 0 14 14" aria-hidden="true"><path id="playIcon" d="M3 1.5 L12 7 L3 12.5 Z"/></svg>
        <span id="playTxt">재생</span>
      </button>
      <input class="scrub" id="scrub" type="range" min="0" max="100" step="0.1" value="0" aria-label="재생 위치">
      <span class="clock" id="clock">0:00 / 1:44</span>
      <button class="btn icon" id="howto" type="button" aria-label="만드는 방법 다시 보기" title="만드는 방법 다시 보기">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v4h4M3.4 7A5 5 0 1 1 4.6 11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="t" id="howtoTxt">만드는 방법</span>
      </button>
      <button class="btn icon" id="rot" type="button" aria-label="화면 돌리기" title="화면 돌리기" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 8a5.2 5.2 0 1 1-1.9-4M13 2v3.2H9.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn icon" id="fs" type="button" aria-label="전체화면" title="전체화면">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path id="fsIcon" d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="t" id="fsTxt">전체화면</span>
      </button>
    </div>
   </div>
  </section>
</div>

<script>
(function(){
"use strict";
/* skip DOM writes whose value did not change */
(function(){
  const sa = Element.prototype.setAttribute, ra = Element.prototype.removeAttribute;
  Element.prototype.setAttribute = function(k, v){ const sv = String(v), c = this.__a || (this.__a = {}); if(c[k] === sv) return; c[k] = sv; sa.call(this, k, sv); };
  Element.prototype.removeAttribute = function(k){ if(this.__a) delete this.__a[k]; ra.call(this, k); };
})();
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
function mk(tag, attrs, parent){ const e = document.createElementNS(NS, tag); if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function txt(parent, x, y, s, attrs){ const e = mk("text", Object.assign({x, y}, attrs || {}), parent); e.textContent = s; return e; }
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eout = p => 1 - Math.pow(1 - p, 3);
const eback = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
function fade(t, a, b, c, d){ if(t < a || t > d) return 0; if(t < b) return seg(t, a, b); if(t <= c) return 1; return 1 - seg(t, c, d); }
function rnd(n){ const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function hex(c){ return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mix(a, b, p){ const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(lerp(v, B[i], p)).toString(16).padStart(2, "0")).join(""); }
function op(e, v){ v = Math.round(v * 1000) / 1000; if(e.__o !== v){ e.__o = v; e.style.opacity = v; } }
function estW(s, fs){ let w = 0; for(const ch of s) w += (ch.charCodeAt(0) > 255 ? 1 : .58) * fs; return w; }
const D2R = Math.PI / 180;
/* angle phi measured clockwise from "up" (screen) */
const pol = (cx, cy, r, phi) => [cx + r * Math.sin(phi * D2R), cy - r * Math.cos(phi * D2R)];

const C = { clay: "#d97757", clayHi: "#cf5a33", sand: "#a9772e", gold: "#b9780a", ink: "#2b2118", muted: "#7a6a58", danger: "#d4412a", enamel: "#8a4a22", bare: "#f3a56c", coilF: "#b8652f", coilB: "#6b3618" };

/* ---------- script ---------- */
const SCENES = [
  { card: "준비물", dur: 11.6, beats: [
    { t: 0,   title: "간이 전동기 준비물 5가지" },
    { t: 1.0, title: "AA 건전지 · 홀더: 코일에 전류를 보내는 전원" },
    { t: 3.1, title: "에나멜선 80cm: 감아서 코일을 만든다" },
    { t: 5.2, title: "원형 자석: 늘 같은 자기장을 만든다" },
    { t: 7.3, title: "금속 받침대 2개: 전류 통로 + 회전축 받침" },
    { t: 9.4, title: "사포: 다리의 피복(절연막)을 벗긴다" }
  ]},
  { card: "조립하기", dur: 15.5, beats: [
    { t: 0,    title: "이제 차례대로 만들어 보자" },

/* log ladder: bars run from the left edge; a lighter tail shows a range */
function ladder(o){
  const g = panelBase();
  txt(g, 90, 150, o.title, { class: "f-disp", "font-size": 38, fill: C.ink });
  txt(g, 90, 182, o.sub, { "font-size": 18, fill: C.muted });
  const lmin = Math.log10(o.min), lmax = Math.log10(o.max);
  const X = v => o.x0 + (Math.log10(v) - lmin) / (lmax - lmin) * (o.x1 - o.x0);
  o.ticks.forEach((tk, k) => {
    const x = o.x0 + k * (o.x1 - o.x0) / (o.ticks.length - 1);
    mk("line", { x1: x, y1: o.y0 - 30, x2: x, y2: o.axisY, stroke: "#e6dac2", "stroke-width": 1 }, g);
    txt(g, x, o.axisY + 24, tk, { "font-size": o.tickFs || 15, fill: C.muted, "text-anchor": "middle", class: "f-mono" });
  });
  mk("line", { x1: o.x0, y1: o.axisY, x2: o.x1, y2: o.axisY, stroke: C.muted, "stroke-width": 2 }, g);
  txt(g, o.x1, o.axisY + 50, o.unit, { "font-size": 16, fill: C.muted, "text-anchor": "end" });
  const rows = o.rows.map((r, i) => {
    const y = o.y0 + i * o.dy, rg = mk("g", { opacity: 0 }, g);
    if(r.hl) mk("rect", { x: 58, y: y - 29, width: 1084, height: 58, rx: 14, fill: r.hl, "fill-opacity": .13 }, rg);
    mk("circle", { cx: 96, cy: y, r: 23, fill: "#2a241e" }, rg);
    const ic = mk("g", { transform: `translate(96 ${y}) scale(.6)` }, rg); ic.innerHTML = ICON[r.icon];
    txt(rg, 132, y - 3, r.name, { "font-size": 22, fill: C.ink, "font-weight": 700 });
    txt(rg, 132, y + 21, r.txt, { "font-size": 16, fill: C.muted });
    const xs = X(r.lo || r.val), xe = X(r.hi || r.val);
    const bar = mk("rect", { x: o.x0, y: y - 10, width: 0, height: 20, rx: 10, fill: r.color }, rg);
    const tail = r.hi ? mk("rect", { x: xs - 10, y: y - 10, width: 0, height: 20, rx: 10, fill: r.color, "fill-opacity": .42 }, rg) : null;
    let tag = null;
    if(r.tag){ tag = txt(rg, xe + 14, y + 6, r.tag, { "font-size": 17, "font-weight": 700, fill: r.tagColor || C.muted }); op(tag, 0); }
    return { rg, bar, tail, xs, xe, tag };
  });
  return { g, rows, x0: o.x0 };
}
function runLadder(Lp, t, a0, step){
  Lp.rows.forEach((r, i) => {
    const a = a0 + i * step, p = eout(seg(t, a, a + .8));
    op(r.rg, seg(t, a, a + .3));
    r.bar.setAttribute("width", Math.max(0, (r.xs - Lp.x0) * p).toFixed(1));
    if(r.tail) r.tail.setAttribute("width", Math.max(0, (r.xe - r.xs + 10) * eout(seg(t, a + .6, a + 1.1))).toFixed(1));
    if(r.tag) op(r.tag, seg(t, a + .7, a + 1));
  });
}

  txt(g, 176 + estW(r[0], 30) + 20, y + 5, r[1], { "font-size": 24, fill: C.ink });
  return g;
});
const ckNote = txt(CP, 90, 630, "그래도 안 되면 손가락으로 다시 살짝 튕겨 보기 (멈춘 자리에선 전류가 끊겨 있을 수 있음)", { "font-size": 19, fill: C.muted }); op(ckNote, 0);

/* ---------- refs ---------- */
const bench = $("bench"), tray = $("tray"), card = $("card"), tcard = $("tcard"), tcIn = $("tcIn"), tcL = $("tcL"), done = $("done"), finger = $("finger");
const hud = $("hud"), hBat = $("hBat"), hBatDot = $("hBatDot"), hsBox = $("hsBox"), hsDot = $("hsDot"), hsTxt = $("hsTxt");

/* rotation angle of the coil in the zoom & side panels (deg, clockwise; ON when 180..360 mod 360) */
function zAlpha(t){ return t < 8 ? 270 : 270 + 90 * (t - 8); }
function sAlpha(t){ return t < 8 ? 270 : 270 + 70 * (t - 8); }
const isOn = a => { const m = ((a % 360) + 360) % 360; return m > 180; };
/* scene-5 coil angle (front view, rad) */
const W5 = 2 * Math.PI * 1.25, TH0 = .35;
function theta5(t){
  if(t < 2.45) return TH0;
  const r = 0.95;
  if(t < 2.45 + r){ const d = t - 2.45; return TH0 + W5 * d * d / (2 * r); }
  const th1 = TH0 + W5 * r / 2;
  if(t < 7.6) return th1 + W5 * (t - 2.45 - r);
  const th2 = th1 + W5 * (7.6 - 2.45 - r), D = 4.0, s = Math.min(D, t - 7.6);
  return th2 + W5 * (s - s * s / (2 * D));
}

/* ---------- render ---------- */
let lastCardIdx = -1, lastScene = -1, lastBeat = null, lastHs = "";
const subG = $("sub");
const subRect = mk("rect", { y: 20, height: 54, rx: 27, fill: "#fffaf0", "fill-opacity": .96, stroke: "#d8caaf", "stroke-width": 1.5 }, subG);
const subTxt = txt(subG, 600, 56, "", { "font-size": 25, "font-weight": 700, fill: C.ink, "text-anchor": "middle" });
function setSub(t){ subTxt.textContent = t; const w = estW(t, 25) + 56; subRect.setAttribute("x", (600 - w / 2).toFixed(1)); subRect.setAttribute("width", w.toFixed(1)); }

function render(T){
  const t1 = T - ST[0], t2 = T - ST[1], t3 = T - ST[2], t4 = T - ST[3], t5 = T - ST[4];
  const si = sceneAt(T);
  const in2 = si === 1, in3 = si === 2, in4 = si === 3, in5 = si === 4;

  /* camera */
  const z = in5 ? 1 + .16 * eio(seg(t5, .2, 1.6)) * (1 - eio(seg(t5, 7.2, 8.2))) : 1;
  bench.setAttribute("transform", `translate(600 ${in5 ? 380 : 360}) scale(${z.toFixed(4)}) translate(-600 ${in5 ? -380 : -360})`);

  /* parts */
  ["hold", "bat", "mag", "brL", "brR", "wire", "paper"].forEach(k => { const s = partState(k, T); place(P[k], s[0], s[1], s[2], s[3], s[4]); });
  op(tray, si === 0 ? seg(t1, 1.4, 1.8) : in2 ? 1 - seg(t2, 14.4, 15) : 0);

  /* coil */
  let cx = 600, cy = 346, cOp = 0;
  const cs = { ring: 0, rx: CR, th: 0, legs: 1, ties: 1, pL: 1, pR: 1, on: 0, mark: 0 };
  if(in2){
    cOp = t2 >= 2.0 ? 1 : 0;
    const nTurn = seg(t2, 2.0, 3.6) * 8, bundle = eio(seg(t2, 4.4, 4.9));
    turnEls.forEach((e, j) => { op(e, t2 < 4.9 ? clamp(nTurn - j) : 0); e.setAttribute("cx", ((-21 + j * 6) * (1 - bundle)).toFixed(1)); });
    const rp = eio(seg(t2, 4.9, 5.6));
    cs.ring = t2 >= 4.9 ? 1 : 0; cs.rx = lerp(7, CR, rp);
    cs.legs = eout(seg(t2, 5.4, 6.0)); cs.ties = seg(t2, 6.0, 6.5);
    cs.pL = seg(t2, 7.6, 8.6); cs.pR = seg(t2, 8.9, 9.9);
    cy = lerp(250, 346, eio(seg(t2, 13.0, 13.9)));
  } else {
    turnEls.forEach(e => op(e, 0));
    if(si >= 2){ cOp = 1; cs.ring = 1; }
    if(in5){
      const th = theta5(t5);
      cs.th = th; cs.mark = 1;
      const powered = t5 >= 2.45 && t5 < 7.6;
      cs.on = powered && Math.sin(th) < 0 ? .8 : 0;
    }
    if(in3) cs.on = t3 > 1 && t3 < 6.6 ? .55 + .2 * Math.sin(T * 8) : 0;
  }
  place(P.coil, cx, cy, 1, 0, cOp);
  drawCoil(cs);

  /* scene 1 card */
  let cO = 0, cSc = 1;
  if(si === 0 && t1 >= 1.0){
    const i = Math.min(4, Math.floor((t1 - 1.0) / 2.1)), u = t1 - 1.0 - 2.1 * i;
    cO = fade(u, .25, .55, 1.6, 1.95); cSc = lerp(.94, 1, eout(seg(u, .25, .55)));
    if(i !== lastCardIdx){
      lastCardIdx = i; const c = CARDS[i];
      $("cIdx").textContent = `${i + 1} / 5 · ${c.cat}`; $("cName").textContent = c.name; $("cSpec").textContent = c.spec;
      $("cU0").textContent = "· " + c.use[0]; $("cU1").textContent = "· " + c.use[1];
      cDotEls.forEach((d, j) => d.setAttribute("fill", j === i ? C.clay : (j < i ? "#cfa77f" : "#d8caaf")));
    }
  }
  card.setAttribute("transform", `translate(895 375) scale(${cSc.toFixed(3)}) translate(-895 -375)`);
  op(card, cO);

  /* scene 2 extras */
  op(lbLine, in2 ? fade(t2, 6.4, 6.7, 7.0, 7.3) : 0);
  op(insets, in2 ? fade(t2, 7.3, 7.6, 9.9, 10.3) : 0);
  op(insL, 1 - (in2 ? seg(t2, 7.6, 8.6) : 1)); op(insR, 1 - (in2 ? seg(t2, 8.9, 9.9) : 1));
  SNAPS.forEach(s => { const p = in2 ? seg(t2, s.t, s.t + .6) : 0; if(p > 0 && p < 1){ s.el.setAttribute("r", (10 + 46 * p).toFixed(1)); op(s.el, 1 - p); } else op(s.el, 0); });
  op(done, in2 ? fade(t2, 14.4, 14.8, 15.1, 15.5) : 0);

  /* scene 3: current path on the bench */
  const flowOn = in3 && t3 > 1.0 && t3 < 6.8;
  op(pMain, flowOn ? fade(t3, 1.0, 1.6, 6.2, 6.7) * .7 : 0);
  op(pBatIn, flowOn ? fade(t3, 3.4, 3.8, 6.2, 6.7) * .8 : 0);
  dots.forEach((c, k) => {
    if(!flowOn || t3 < 2.2){ op(c, 0); return; }
    const d = (t3 - 2.2) * 150 - k * GAP;
    if(d < 0){ op(c, 0); return; }
    const p = at(TM, d % TM.L); c.setAttribute("cx", p[0].toFixed(1)); c.setAttribute("cy", p[1].toFixed(1)); op(c, fade(t3, 2.2, 2.4, 6.2, 6.7));
  });
  op(lb1, in3 ? fade(t3, 2.4, 2.8, 6.2, 6.6) : 0);
  op(lb2, in3 ? fade(t3, 2.9, 3.3, 6.2, 6.6) : 0);
  op(lb3, in3 ? fade(t3, 3.4, 3.8, 6.2, 6.6) : 0);
  op(lb4, in3 ? fade(t3, 3.9, 4.3, 6.2, 6.6) : 0);
  op(nDir, in3 ? fade(t3, 5.0, 5.3, 6.3, 6.6) : 0);

  /* zoom panel */
  op(ZP, in3 ? fade(t3, 6.6, 7.1, 13.4, 13.9) : 0);
  if(in3 && t3 > 6.5 && t3 < 14){
    const a = zAlpha(t3), on = isOn(a);
    const b0 = a + 90;  /* enamel half: centred opposite the bare face (bare centre = a - 90) */
    const p0 = pol(LC[0], LC[1], 51.5, b0 - 90), pm = pol(LC[0], LC[1], 51.5, b0), p1 = pol(LC[0], LC[1], 51.5, b0 + 90);
    zEnam.setAttribute("d", `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A51.5 51.5 0 0 1 ${pm[0].toFixed(1)} ${pm[1].toFixed(1)} A51.5 51.5 0 0 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`);
    op(zSpark, on ? .7 + .3 * Math.sin(T * 30) : 0);
    zRod.setAttribute("transform", `translate(${DC[0]} ${DC[1]}) rotate(${(a % 360).toFixed(1)})`);
    zChipT.textContent = on ? "전류 ON" : "전류 OFF";
    zChipT.setAttribute("fill", on ? C.clayHi : C.sand); zChipR.setAttribute("stroke", on ? C.clayHi : C.sand);
  }

  /* current ladder + heat panel */
  op(IP.g, in3 ? fade(t3, 13.8, 14.3, 19.9, 20.4) : 0);
  if(in3) runLadder(IP, t3, 14.6, 1.0);
  op(HP, in3 ? fade(t3, 20.3, 20.8, 25.6, 26) : 0);
  hR.forEach((g, i) => op(g, in3 ? seg(t3, 20.8 + i * .45, 21.1 + i * .45) : 0));
  op(hF, in3 ? seg(t3, 22.2, 22.6) : 0);
  hC.forEach((g, i) => op(g, in3 ? seg(t3, 23.0 + i * .9, 23.4 + i * .9) : 0));

  /* scene 4: front-view magnet field */
  FF.forEach((p, j) => {
    const v = in4 ? fade(t4, .2, .6, 4.3, 4.8) : 0;
    if(v <= 0){ op(p, 0); return; }
    const d = eio(seg(t4, .3 + j * .12, 1.6 + j * .12));
    p.setAttribute("stroke-dasharray", `${p._L.toFixed(0)} ${p._L.toFixed(0)}`); p.setAttribute("stroke-dashoffset", (p._L * (1 - d)).toFixed(1));
    op(p, .85 * v);
  });
  op(magPole, in4 ? fade(t4, .4, .8, 4.3, 4.8) : 0);
  op(nField, in4 ? fade(t4, 2.8, 3.1, 4.3, 4.7) : 0);

  /* side panel */
  op(SP, in4 ? fade(t4, 4.6, 5.1, 14.8, 15.3) : 0);
  if(in4 && t4 > 4.5 && t4 < 15.4){
    sField.forEach((p, j) => { const d = eio(seg(t4, 5.0 + j * .1, 5.9 + j * .1)); p.setAttribute("stroke-dasharray", `${p._L.toFixed(0)} ${p._L.toFixed(0)}`); p.setAttribute("stroke-dashoffset", (p._L * (1 - d)).toFixed(1)); op(p, .9); });
    const a = sAlpha(t4), started = t4 >= 6.0, on = started && isOn(a), sa = Math.sin(a * D2R), ca = Math.cos(a * D2R);
    sRot.setAttribute("transform", `translate(${C4[0]} ${C4[1]}) rotate(${(a % 360).toFixed(1)})`);
    const cfTarget = on ? 1 : 0;
    op(sCF, started ? cfTarget * seg(t4, 6.0, 6.6) : 0);
    const mx = sa, my = -ca;  /* coil dipole direction on screen */
    const show = on ? seg(t4, 6.2, 6.7) : 0;
    [[sN, 1], [sS, -1]].forEach(([o, s]) => {
      const x = C4[0] + s * 46 * mx, y = C4[1] + s * 46 * my;
      o.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`); op(o.g, show);
      const f = t4 >= 8 ? show * clamp(Math.abs(sa) * 1.6) : 0, dir = s > 0 ? -1 : 1;
      o.ar.setAttribute("x1", (x + 24 * Math.sign(mx || 1) * s).toFixed(1)); o.ar.setAttribute("y1", y.toFixed(1));
      o.ar.setAttribute("x2", (x + 24 * Math.sign(mx || 1) * s).toFixed(1)); o.ar.setAttribute("y2", (y + dir * 46).toFixed(1));
      op(o.ar, f);
      o.at.textContent = s > 0 ? "밀어냄" : "끌어당김";
      o.at.setAttribute("x", (x + 24 * Math.sign(mx || 1) * s + (s * Math.sign(mx || 1) > 0 ? 10 : -10)).toFixed(1)); o.at.setAttribute("y", (y + dir * 30).toFixed(1));
      o.at.setAttribute("text-anchor", s * Math.sign(mx || 1) > 0 ? "start" : "end");
      op(o.at, f);
    });
    op(leg4, seg(t4, 6.2, 6.7));
    op(sChip, seg(t4, 6.0, 6.4));
    const st = !started ? "" : on ? "전류 ON · 코일 = 전자석" : "전류 OFF · 관성으로 회전";
    if(sChipT.textContent !== st) sChipT.textContent = st;
    sChipT.setAttribute("fill", on ? C.clayHi : C.sand); sChipR.setAttribute("stroke", on ? C.clayHi : C.sand);
    op(sNote, seg(t4, 12.4, 12.8));
  }

  /* magnetic ladder */
  op(BP.g, in4 ? fade(t4, 15.2, 15.7, 23.7, 24) : 0);
  if(in4) runLadder(BP, t4, 16.0, 1.05);
  op(bBox, in4 ? seg(t4, 18.8, 19.3) : 0);

  /* scene 5 */
  op(finger, in5 ? fade(t5, 1.9, 2.2, 2.6, 2.95) : 0);
  if(in5){
    const p = eio(seg(t5, 1.9, 2.45)), q = eout(seg(t5, 2.45, 2.9));
    const fx = lerp(lerp(760, 652, p), 720, q), fy = lerp(lerp(215, 296, p), 240, q);
    finger.setAttribute("transform", `translate(${fx.toFixed(1)} ${fy.toFixed(1)}) rotate(${lerp(-28, -48, q).toFixed(1)})`);
  }
  op(nSpeed, in5 ? fade(t5, 3.4, 3.8, 5.4, 5.7) : 0);
  op(nDirR, in5 ? fade(t5, 5.7, 6.0, 7.2, 7.4) : 0);
  op(hud, in5 ? seg(t5, .6, 1.1) * (1 - seg(t5, 11.6, 12)) : 0);
  if(in5){
    const out = t5 >= 7.6;
    hBat.textContent = out ? "건전지: 뺌" : "건전지: 끼움"; hBatDot.setAttribute("fill", out ? "#b8ab95" : C.clay);
    let hs = "멈춤";
    if(t5 >= 2.45 && t5 < 7.6) hs = "한 방향으로 회전 중"; else if(t5 >= 7.6 && t5 < 11.5) hs = "관성으로 감속"; else if(t5 >= 11.5) hs = "멈춤";
    if(hs !== lastHs){ lastHs = hs; const col = hs === "한 방향으로 회전 중" ? C.clayHi : C.sand; hsTxt.textContent = "코일: " + hs; hsTxt.setAttribute("fill", col); hsDot.setAttribute("fill", col); hsBox.setAttribute("stroke", col); }
  }
  op(CP, in5 ? seg(t5, 11.8, 12.3) : 0);
  CK.forEach((g, i) => op(g, in5 ? seg(t5, 12.4 + i * 1.2, 12.8 + i * 1.2) : 0));
  op(ckNote, in5 ? seg(t5, 16.0, 16.3) : 0);

  /* title card */
  const sc = SCENES[si], tl = T - sc.start;
  if(si !== lastScene){ lastScene = si; $("tcK").textContent = "PART " + (si + 1); $("tcN").textContent = sc.card; }
  op(tcard, si === 0 ? fade(tl, -1, 0, .7, 1.0) : fade(tl, 0, .15, .7, 1.0));
  tcIn.setAttribute("transform", `translate(0 ${lerp(26, 0, eout(seg(tl, 0, .5))).toFixed(1)})`);
  const lw = 180 * eout(seg(tl, .1, .6));
  tcL.setAttribute("x", (600 - lw / 2).toFixed(1)); tcL.setAttribute("width", lw.toFixed(1));

  /* subtitle */
  let b = sc.beats[0];
  for(const x of sc.beats) if(tl >= x.t) b = x;
  if(b !== lastBeat){ lastBeat = b; setSub(b.title); }

  scrub.value = R.toFixed(1);
  clock.textContent = `${fmt(R)} / ${fmt(TOTAL_R)}`;
}
function fmt(s){ s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

/* ---------- controls ---------- */
const scrub = $("scrub"), clock = $("clock"), playBtn = $("play"), playTxt = $("playTxt"), playIcon = $("playIcon");
/* time warp [script s, real s]: one segment per scene now (1:1); change only here to retime */
/* scene 2: parts flying around = short, hands-on making (winding, tying, sanding) = long */
const SEGS = [[11.6, 11.6],
  [1.0, 1.0], [1.0, .6], [1.6, 6], [1.3, 1.8], [.7, 1.2], [.4, 1.5], [.5, 4], [.7, 3],
  [.4, .5], [1.0, 5], [.3, .4], [1.0, 5.5], [.5, .6], [.9, 1.8], [.5, 2.5],
  [.1, .2], [.7, 1.6], [.3, 2.5], [.1, .3], [.9, 2.2], [.5, 2.5], [1.1, 1.8],
  [14, 14], [15.2, 15.2], [17, 17]];
const WS = [0], WR = [0];
SEGS.forEach(g => { WS.push(WS[WS.length - 1] + g[0]); WR.push(WR[WR.length - 1] + g[1]); });
const TOTAL_R = WR[WR.length - 1];
function warp(x, A, B){ if(x <= 0) return 0; if(x >= A[A.length - 1]) return B[B.length - 1]; let i = 0; while(A[i + 1] < x) i++; return B[i] + (x - A[i]) / (A[i + 1] - A[i]) * (B[i + 1] - B[i]); }
const R2S = r => warp(r, WR, WS), S2R = t => warp(t, WS, WR);
scrub.max = TOTAL_R;
let R = 0, T = 0, playing = false, lastTs = null, stopAt = null;
function sync(){ T = Math.min(TOTAL - 1e-3, R2S(R)); render(T); }
function setPlaying(v){
  playing = v;
  if(v && R >= TOTAL_R - .01) R = 0;
  if(v && stopAt != null && R >= stopAt - .01) endSection();
  const ended = !v && R >= TOTAL_R - .01;
  playTxt.textContent = v ? "일시정지" : (ended ? "다시 보기" : "재생");
  playBtn.setAttribute("aria-label", playTxt.textContent);
  playIcon.setAttribute("d", v ? "M2.5 1.5 H5.5 V12.5 H2.5 Z M8.5 1.5 H11.5 V12.5 H8.5 Z" : "M3 1.5 L12 7 L3 12.5 Z");
  lastTs = null;
  if(typeof wake === "function" && typeof idleT !== "undefined") wake();
}
let fAvg = 16.7, fN = 0, lite = false;
function frame(ts){
  if(playing){
    if(lastTs != null){
      const dt = ts - lastTs;
      R = Math.min(TOTAL_R, R + Math.min(.1, dt / 1000));
      fAvg = fAvg * .92 + dt * .08;
      if(++fN > 60 && fAvg > 26 && !lite){ lite = true; $("svg").classList.add("lite"); }
    }
    lastTs = ts;
    if(R >= TOTAL_R){ R = TOTAL_R; setPlaying(false); }
    if(stopAt != null && R >= stopAt){ R = stopAt; endSection(); setPlaying(false); }
    sync();
  }
  requestAnimationFrame(frame);
}
playBtn.addEventListener("click", () => setPlaying(!playing));
scrub.addEventListener("input", () => { endSection(); R = parseFloat(scrub.value) || 0; sync(); });
/* "만드는 방법" button: replay only the assembly part (scene 2), then pause */
const howBtn = $("howto");
function endSection(){ stopAt = null; howBtn.classList.remove("on"); }
howBtn.addEventListener("click", () => {
  R = S2R(ST[1]); stopAt = S2R(ST[2]) - .05;
  howBtn.classList.add("on"); sync(); setPlaying(true);
});
document.addEventListener("keydown", e => {
  if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") && e.key === " ") return;
  if(e.key === " "){ e.preventDefault(); setPlaying(!playing); }
  else if(e.key === "ArrowRight" && e.target.tagName !== "INPUT"){ R = Math.min(TOTAL_R, R + 3); sync(); }
  else if(e.key === "ArrowLeft" && e.target.tagName !== "INPUT"){ R = Math.max(0, R - 3); sync(); }
});

/* fullscreen: native API when allowed, otherwise viewport-filling mode; portrait phones rotate the inner .rig */
const playerEl = $("player"), fsBtn = $("fs"), rotBtn = $("rot"), fsIcon = $("fsIcon"), fsTxt = $("fsTxt");
const FS_ON = "M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4", FS_OFF = "M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4";
let isFull = false, rotPref = null, nativeSeen = false;
function applyRot(){
  const portrait = window.innerHeight > window.innerWidth;
  playerEl.classList.toggle("rot", isFull && (rotPref === null ? portrait : rotPref));
  rotBtn.hidden = !isFull;
}
let idleT = null;
function wake(){
  playerEl.classList.remove("idle"); clearTimeout(idleT);
  if(isFull && playing) idleT = setTimeout(() => playerEl.classList.add("idle"), 2500);
}
["pointerdown", "pointermove", "keydown", "touchstart"].forEach(ev => playerEl.addEventListener(ev, wake, { passive: true }));
function setFull(v){
  isFull = v; fN = 0; fAvg = 16.7;
  playerEl.classList.toggle("full", v);
  document.documentElement.classList.toggle("lock", v);
  fsIcon.setAttribute("d", v ? FS_OFF : FS_ON);
  fsTxt.textContent = v ? "나가기" : "전체화면";
  fsBtn.setAttribute("aria-label", fsTxt.textContent);
  if(v){
    try { const r = playerEl.requestFullscreen && playerEl.requestFullscreen(); if(r && r.catch) r.catch(() => {}); } catch(e){}
    try { if(screen.orientation && screen.orientation.lock){ const r = screen.orientation.lock("landscape"); if(r && r.catch) r.catch(() => {}); } } catch(e){}
  } else {
    rotPref = null; nativeSeen = false;
    try { if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch(e){}
    try { if(document.fullscreenElement){ const r = document.exitFullscreen(); if(r && r.catch) r.catch(() => {}); } } catch(e){}
  }
  applyRot(); wake();
}
fsBtn.addEventListener("click", () => setFull(!isFull));
rotBtn.addEventListener("click", () => { rotPref = !playerEl.classList.contains("rot"); applyRot(); });
document.addEventListener("fullscreenchange", () => { if(document.fullscreenElement) nativeSeen = true; else if(isFull && nativeSeen) setFull(false); setTimeout(applyRot, 120); });
window.addEventListener("resize", applyRot);
document.addEventListener("keydown", e => { if(e.key === "Escape" && isFull) setFull(false); });

window.__anim = { seek(t){ R = S2R(t); sync(); }, total: TOTAL_R, starts: ST, script: TOTAL };

sync();
let reduce = false;
try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}
setPlaying(!reduce);
requestAnimationFrame(frame);
})();
